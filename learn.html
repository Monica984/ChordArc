<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Learn Guitar — ChordArc</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="styles.css"/><link rel="stylesheet" href="pages.css"/></head><body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">⌁</span><span>ChordArc</span></a><nav class="main-nav"><a href="index.html">Songs</a><a class="active" href="learn.html">Learn</a><a href="create.html">Create</a></nav><a class="nav-button" href="index.html#songs">Find a song</a></header><main class="page-main shell"><section class="page-hero"><p class="eyebrow">GUITAR • LEARN</p><h1>Learn the <em>language</em> of guitar.</h1><p class="page-intro">Pick a topic, open a lesson and actually practise it.</p></section><section class="learning-section"><div class="section-heading"><div><p class="eyebrow">CHORD LIBRARY</p><h2>Start with the essentials</h2></div></div><div class="lesson-grid" id="chordGrid"></div></section><section class="learning-section"><div class="section-heading"><div><p class="eyebrow">SKILLS</p><h2>Build your playing</h2></div></div><div class="skill-grid"><button class="skill-card" onclick="openTopic('Strumming patterns','↓ ↓ ↑ ↑ ↓ ↑','Count 1 & 2 & 3 & 4 &. Play down on 1 and 2, then add the upstrokes slowly. Keep your wrist loose and let the movement come from the wrist, not the whole arm.','Practice: mute the strings with your fretting hand and repeat the pattern until the motion feels automatic.')"><span>01</span><h3>Strumming</h3><p>Patterns, timing and accents.</p><b>Open lesson →</b></button><button class="skill-card" onclick="openTopic('Fingerpicking','P i m a • P i m a','Use your thumb (P) for the bass string, index (i), middle (m) and ring (a) for the higher strings. Start with one chord and repeat the pattern evenly.','Practice: play Em slowly for four rounds without changing tempo. Then try Am and switch between them.')"><span>02</span><h3>Fingerpicking</h3><p>Patterns and right-hand control.</p><b>Open lesson →</b></button><button class="skill-card" onclick="openTopic('Chord progressions','C → G → Am → F','A progression is simply a sequence of chords. Listen for how one chord creates a feeling and the next one changes or resolves it.','Practice: loop C → G → Am → F. Give each chord four beats and listen to the direction of the progression.')"><span>03</span><h3>Chord progressions</h3><p>Make chords work together.</p><b>Open lesson →</b></button><button class="skill-card" onclick="openTopic('Chord transitions','C ↔ G • Am ↔ F','Put both chord shapes down without strumming first. Find the fingers that can stay close to the strings, then make the change slowly.','Practice: set a 60 BPM count. Change once every four beats. Increase the tempo only when the change stays clean.')"><span>04</span><h3>Chord transitions</h3><p>Move between shapes cleanly.</p><b>Open lesson →</b></button></div></section></main><div class="modal-backdrop" id="lessonModal" hidden><div class="modal" id="lessonBox"><button class="modal-close" onclick="closeLesson()">×</button><p class="eyebrow" id="lessonEyebrow">GUITAR LESSON</p><h2 id="lessonTitle"></h2><p id="lessonShape" class="chord-shape-text"></p><div id="diagramWrap"><div class="lesson-big-diagram"><div class="big-nut"></div><div class="big-strings"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="big-frets"><span></span><span></span><span></span><span></span><span></span></div><div class="big-dots" id="bigDots"></div><div class="open-label" id="openLabel"></div><div class="string-labels"><span>e</span><span>B</span><span>G</span><span>D</span><span>A</span><span>E</span></div></div></div><div class="modal-block"><h3>How to practise</h3><p id="lessonText"></p></div><div class="modal-block"><h3>Try this</h3><p id="lessonPractice"></p></div><button class="primary-button" onclick="closeLesson()">Got it — let's play</button></div></div><script>const chords=[['C Major','x 3 2 0 1 0','A foundational open chord.'],['G Major','3 2 0 0 0 3','A bright, useful open chord.'],['A Minor','x 0 2 2 1 0','A mellow minor chord.'],['E Minor','0 2 2 0 0 0','Easy to play and great for transitions.'],['D Major','x x 0 2 3 2','A compact open chord.'],['E Major','0 2 2 1 0 0','A strong, versatile major chord.'],['A Major','x 0 2 2 2 0','A classic open major shape.'],['D Minor','x x 0 2 3 1','A darker minor variation of D.']];const grid=document.getElementById('chordGrid');chords.forEach((c,i)=>{const b=document.createElement('button');b.className='lesson-card'+(i===0?' lesson-featured':'');b.innerHTML=`<span class="lesson-tag">${String(i+1).padStart(2,'0')} • ${c[0].includes('Minor')?'MINOR':'OPEN'}</span><div class="chord-diagram"><span>${c[1][0]}</span><i></i><i></i><i></i><i></i><i></i><span>${c[1][5]}</span></div><h3>${c[0]}</h3><p>${c[2]}</p><b>Learn chord →</b>`;b.onclick=()=>openChord(c[0],c[1],c[2]);grid.appendChild(b)});function drawDots(shape){const wrap=document.getElementById('bigDots');wrap.innerHTML='';const vals=shape.split(' ');vals.forEach((v,s)=>{if(v==='x'||v==='0')return;const fret=parseInt(v,10);const dot=document.createElement('span');dot.className='big-dot';dot.textContent=fret;dot.style.left=`${s*20}%`;dot.style.top=`${Math.min(90,(fret-.5)*20)}%`;wrap.appendChild(dot)});document.getElementById('openLabel').textContent=vals.map(v=>v==='0'?'○':v==='x'?'×':'').join('  ')}function openChord(title,shape,text){document.getElementById('lessonEyebrow').textContent='CHORD LESSON';document.getElementById('lessonTitle').textContent=title;document.getElementById('lessonShape').textContent=shape+' • standard tuning';document.getElementById('lessonText').textContent=text;document.getElementById('lessonPractice').textContent='Play the shape one string at a time, then strum it slowly. Check that every fretted note rings clearly.';document.getElementById('diagramWrap').style.display='block';drawDots(shape);document.getElementById('lessonModal').hidden=false;document.body.style.overflow='hidden'}function openTopic(title,shape,text,practice){document.getElementById('lessonEyebrow').textContent='GUITAR SKILL';document.getElementById('lessonTitle').textContent=title;document.getElementById('lessonShape').textContent=shape;document.getElementById('lessonText').textContent=text;document.getElementById('lessonPractice').textContent=practice;document.getElementById('diagramWrap').style.display='none';document.getElementById('lessonModal').hidden=false;document.body.style.overflow='hidden'}function closeLesson(){document.getElementById('lessonModal').hidden=true;document.body.style.overflow=''}document.getElementById('lessonModal').addEventListener('click',e=>{if(e.target.id==='lessonModal')closeLesson()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLesson()});</script></body></html>
