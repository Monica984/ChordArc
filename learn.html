<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Learn Guitar — ChordArc</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"/><link rel="stylesheet" href="styles.css"/><link rel="stylesheet" href="pages.css"/></head><body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">⌁</span><span>ChordArc</span></a><nav class="main-nav"><a href="index.html">Songs</a><a class="active" href="learn.html">Learn</a><a href="create.html">Create</a></nav><a class="nav-button" href="index.html#songs">Find a song</a></header><main class="page-main shell"><section class="page-hero"><p class="eyebrow">GUITAR • LEARN</p><h1>Learn the <em>language</em> of guitar.</h1><p class="page-intro">Pick a topic, open a lesson and actually practise it.</p></section><section class="learning-section"><div class="section-heading"><div><p class="eyebrow">CHORD LIBRARY</p><h2>Start with the essentials</h2></div></div><div class="lesson-grid" id="chordGrid"></div></section><section class="learning-section"><div class="section-heading"><div><p class="eyebrow">SKILLS</p><h2>Build your playing</h2></div></div><div class="skill-grid"><button class="skill-card" onclick="openTopic('Strumming patterns','Learn downstrokes, upstrokes, accents and how to count a pattern.','↓ ↓ ↑ ↑ ↓ ↑')"><span>01</span><h3>Strumming</h3><p>Patterns, timing and accents.</p></button><button class="skill-card" onclick="openTopic('Fingerpicking','Start with a simple thumb-and-fingers pattern, then build independence.','P i m a • P i m a')"><span>02</span><h3>Fingerpicking</h3><p>Patterns and right-hand control.</p></button><button class="skill-card" onclick="openTopic('Chord progressions','Understand how chords are grouped into progressions and practise common changes.','C → G → Am → F')"><span>03</span><h3>Chord progressions</h3><p>Make chords work together.</p></button><button class="skill-card" onclick="openTopic('Chord transitions','Practise two-chord changes slowly, then increase speed while keeping your rhythm steady.','C ↔ G • Am ↔ F')"><span>04</span><h3>Chord transitions</h3><p>Move between shapes cleanly.</p></button></div></section></main><div class="modal-backdrop" id="lessonModal" hidden><div class="modal"><button class="modal-close" onclick="closeLesson()">×</button><p class="eyebrow">GUITAR LESSON</p><h2 id="lessonTitle"></h2><p id="lessonShape"></p><div class="lesson-big-diagram"><div class="open-label" id="openLabel"></div><div class="big-strings"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="big-frets"><span></span><span></span><span></span><span></span><span></span></div><div class="big-nut"></div><div class="big-dots" id="bigDots"></div><div class="string-labels"><span>e</span><span>B</span><span>G</span><span>D</span><span>A</span><span>E</span></div></div><div class="modal-block"><h3>How to practise</h3><p id="lessonText"></p></div><button class="primary-button" onclick="closeLesson()">Got it — let's play</button></div></div><script>
const chords=[['C Major','x 3 2 0 1 0','A foundational open chord.'],['G Major','3 2 0 0 0 3','A bright, useful open chord.'],['A Minor','x 0 2 2 1 0','A mellow minor chord.'],['E Minor','0 2 2 0 0 0','Easy to play and great for transitions.'],['D Major','x x 0 2 3 2','A compact open chord.'],['E Major','0 2 2 1 0 0','A strong, versatile major chord.'],['A Major','x 0 2 2 2 0','A classic open major shape.'],['D Minor','x x 0 2 3 1','A darker minor variation of D.']];const grid=document.getElementById('chordGrid');chords.forEach((c,i)=>{const b=document.createElement('button');b.className='lesson-card'+(i===0?' lesson-featured':'');b.innerHTML=`<span class="lesson-tag">${String(i+1).padStart(2,'0')} • ${c[0].includes('Minor')?'MINOR':'OPEN'}</span><div class="chord-diagram"><span>${c[1][0]}</span><i></i><i></i><i></i><i></i><i></i><span>${c[1][5]}</span></div><h3>${c[0]}</h3><p>${c[2]}</p><b>Learn chord →</b>`;b.onclick=()=>openChord(c[0],c[1],c[2]);grid.appendChild(b)});function drawDots(shape){const wrap=document.getElementById('bigDots');wrap.innerHTML='';const vals=shape.split(' ');vals.forEach((v,s)=>{if(v==='x'||v==='0')return;const fret=Math.max(1,parseInt(v,10));const dot=document.createElement('span');dot.className='big-dot';dot.textContent=fret;dot.style.left=`${s*20}%`;dot.style.top=`${(fret-.5)*20}%`;wrap.appendChild(dot)});document.getElementById('openLabel').textContent=vals.map(v=>v==='0'?'○':v==='x'?'×':'').join('  ')}function openChord(title,shape,text){openLesson(title,shape,text);drawDots(shape)}function openTopic(title,text,example){openLesson(title,example,text);document.getElementById('bigDots').innerHTML=''}function openLesson(title,shape,text){document.getElementById('lessonTitle').textContent=title;document.getElementById('lessonShape').textContent=shape;document.getElementById('lessonText').textContent=text;document.getElementById('lessonModal').hidden=false;document.body.style.overflow=''}function closeLesson(){document.getElementById('lessonModal').hidden=true;document.body.style.overflow=''}document.getElementById('lessonModal').addEventListener('click',e=>{if(e.target.id==='lessonModal')closeLesson()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLesson()});</script></body></html>
